<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reading flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F7FC; --card:#FFFFFF; --ink:#1B2433; --soft:#5B6678; --line:#DCE4EF;
  --accent:#3A86FF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121826; --card:#1C2436; --ink:#F2F5FA; --soft:#A7B1C2; --line:#2E3850;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121826; --card:#1C2436; --ink:#F2F5FA; --soft:#A7B1C2; --line:#2E3850;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Andika","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  display:flex;flex-direction:column;
}
.groups{
  display:flex;gap:8px;overflow-x:auto;padding:12px 14px 8px;
  scrollbar-width:none;flex:0 0 auto;
}
.groups::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;font:inherit;font-size:17px;font-weight:700;
  padding:9px 16px;border-radius:999px;border:2px solid var(--line);
  background:var(--card);color:var(--ink);cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.chip:focus-visible,.btn:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.stage{flex:1 1 auto;display:flex;padding:8px 14px;min-height:0}
.card{
  flex:1;display:flex;flex-direction:column;gap:2vh;align-items:center;justify-content:center;
  background:var(--card);border-radius:28px;
  border-bottom:10px solid var(--accent);
  cursor:pointer;user-select:none;-webkit-user-select:none;
  touch-action:pan-y;min-height:0;overflow:hidden;position:relative;
}
.speak{
  position:absolute;top:14px;right:14px;width:68px;height:68px;border-radius:50%;
  border:none;background:var(--accent);color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;
}
.speak svg{width:36px;height:36px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.speak:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.speak.on{animation:pulse .6s ease-out}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.speak.on{animation:none}}
.word{
  font-weight:700;line-height:1;letter-spacing:.02em;
  font-size:min(34vw, 30vh, 260px);
  white-space:nowrap;
}
.word.long{font-size:min(24vw, 26vh, 220px)}
.word.split .l{margin:0 .12em}
.v{color:var(--accent)}
.word.pop{animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.word.pop{animation:none}}
.word.right,.word.right .v{color:#22A55B}
.check{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0}
.check svg{width:min(42vw,40vh,280px);height:auto}
.check.show{animation:check .65s ease-out}
@keyframes check{0%{opacity:0;transform:scale(.5)}30%{opacity:.95;transform:scale(1.05)}75%{opacity:.95;transform:scale(1)}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.check.show{animation:none;opacity:.95}}
.word.done{font-size:min(14vw,10vh,72px);white-space:normal;text-align:center}
.donebox{display:flex;flex-direction:column;align-items:center;gap:14px}
.donebox svg{width:min(32vw,22vh,160px);height:auto}
.donebox small{font-size:20px;color:var(--soft);font-weight:400}
.ok-count{color:#22A55B;font-weight:700;margin-left:12px}
.pic{font-size:min(26vw,22vh,170px);line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.pic:empty{display:none}
.pic img{width:min(36vw,26vh,200px);height:auto;display:block}
.word.withpic{font-size:min(26vw,20vh,200px)}
.word.withpic.long{font-size:min(20vw,17vh,170px)}
.forvo{
  position:absolute;top:14px;left:14px;height:48px;padding:0 16px;border-radius:999px;
  border:2px solid var(--line);background:var(--card);color:var(--ink);
  font-weight:700;font-size:16px;display:flex;align-items:center;text-decoration:none;
}
.forvo:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.mic{
  position:absolute;bottom:14px;right:14px;width:60px;height:60px;border-radius:50%;
  border:2px solid var(--line);background:var(--card);color:var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
}
.mic svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mic:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.mic.rec{background:#E5383B;border-color:#E5383B;color:#fff;animation:recpulse 1s infinite}
@keyframes recpulse{50%{box-shadow:0 0 0 12px rgba(229,56,59,.25)}}
@media (prefers-reduced-motion: reduce){.mic.rec{animation:none}}
.speak.mine::after{
  content:"";position:absolute;top:0;right:0;width:18px;height:18px;border-radius:50%;
  background:#22A55B;border:3px solid var(--card);
}
.toast{
  position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:16px;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;z-index:5;
}
.toast.show{opacity:1}

.controls{
  flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  padding:10px 14px 16px;
}
.btn{
  font:inherit;font-weight:700;font-size:20px;border-radius:18px;
  border:2px solid var(--line);background:var(--card);color:var(--ink);
  padding:14px 0;cursor:pointer;min-width:0;
}
.btn.big{flex:1 1 40%;background:var(--accent);border-color:var(--accent);color:#fff;font-size:24px}
.btn.small{flex:1 1 28%;font-size:16px}
.btn.ok{background:#22A55B;border-color:#22A55B}
.btn:disabled{opacity:.4;cursor:default}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.count{
  text-align:center;color:var(--soft);font-size:15px;padding:0 14px;flex:0 0 auto;
}
</style>
</head>
<body>
<nav class="groups" id="groups" aria-label="Word groups"></nav>

<main class="stage">
  <div class="card" id="card" tabindex="0" role="button" aria-label="Next word">
    <button class="speak" id="speak" aria-label="Hear the word"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#fff"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
    <a class="forvo" id="forvo" target="_blank" rel="noopener" aria-label="Hear this word on Forvo (opens in a new tab)">Forvo ↗</a>
    <button class="mic" id="mic" aria-label="Record your voice"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <div class="pic" id="pic" aria-hidden="true"></div>
    <div class="word" id="word" aria-live="polite"></div>
    <div class="check" id="check" aria-hidden="true"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#22A55B"/><path d="M28 52l15 15 30-32" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>
</main>

<div class="count" id="count"></div>
<div class="controls">
  <button class="btn small" id="prev" aria-label="Previous word">Back</button>
  <button class="btn small" id="split" aria-pressed="false">Sound out</button>
  <button class="btn small" id="shuffle">Shuffle</button>
  <button class="btn big" id="next">Next</button>
  <button class="btn big ok" id="correct">✓ Correct</button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const $ = id => document.getElementById(id);
const wordEl = $("word"), card = $("card");
let group = GROUPS[0], order = [], pos = 0, split = false, sight = false, finished = false, busy = false, right = 0;

function setGroup(g){
  group = g;
  sight = g.id.startsWith("sight");
  order = [...g.list]; pos = 0; right = 0;
  document.documentElement.style.setProperty("--accent", g.color);
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.id === g.id));
  try{ localStorage.setItem("rf-group", g.id); }catch(e){}
  render();
}

function render(){
  finished = false;
  wordEl.classList.remove("done", "right");
  $("speak").style.visibility = "visible";
  $("mic").style.visibility = "visible";
  $("correct").disabled = false;
  const w = order[pos];
  const pic = $("pic"); pic.innerHTML = "";
  if(w in IMG){ const im = new Image(); im.src = IMGDATA[IMG[w]]; im.alt = ""; im.draggable = false; pic.appendChild(im); }
  else pic.textContent = PICS[w] || "";
  $("forvo").href = `https://forvo.com/word/${encodeURIComponent(w.toLowerCase())}/#en`;
  $("forvo").style.visibility = "visible";
  wordEl.innerHTML = "";
  [...w].forEach(ch => {
    const s = document.createElement("span");
    s.className = "l" + (!sight && "aeiou".includes(ch) ? " v" : "");
    s.textContent = ch;
    wordEl.appendChild(s);
  });
  wordEl.classList.toggle("split", split);
  wordEl.classList.toggle("withpic", !!PICS[w] || w in IMG);
  markMine();
  wordEl.classList.toggle("long", w.length > 4 || (split && w.length > 3));
  wordEl.classList.remove("pop"); void wordEl.offsetWidth; wordEl.classList.add("pop");
  $("count").innerHTML = `${pos + 1} of ${order.length} left` + (right ? `<span class="ok-count">✓ ${right}</span>` : "");
}

function step(d){
  if(busy) return;
  if(finished){ setGroup(group); return; }
  pos = (pos + d + order.length) % order.length; render();
}

function showDone(){
  finished = true;
  if("speechSynthesis" in window) speechSynthesis.cancel();
  wordEl.className = "word done";
  wordEl.innerHTML = `<div class="donebox"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#22A55B"/><path d="M28 52l15 15 30-32" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg><div>All done!</div><small>Tap Next to play again</small></div>`;
  $("speak").style.visibility = "hidden";
  $("mic").style.visibility = "hidden";
  $("pic").textContent = "";
  $("forvo").style.visibility = "hidden";
  $("correct").disabled = true;
  $("count").innerHTML = `<span class="ok-count">✓ ${right} correct</span>`;
}

let actx = null;
function ding(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!actx) actx = new AC();
    if(actx.state === "suspended") actx.resume();
    const t0 = actx.currentTime;
    const master = actx.createGain(); master.gain.value = 0.5; master.connect(actx.destination);
    // bright rising chime: C6, E6, G6, C7
    [1046.5, 1318.5, 1568.0, 2093.0].forEach((f, i) => {
      const t = t0 + i * 0.075;
      [1, 2.01].forEach((mult, k) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = "sine"; o.frequency.value = f * mult;
        const peak = k ? 0.08 : 0.35;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(peak, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + (i === 3 ? 0.9 : 0.45));
        o.connect(g); g.connect(master);
        o.start(t); o.stop(t + 1);
      });
    });
  }catch(e){}
}

function markCorrect(){
  if(finished || busy) return;
  busy = true;
  if("speechSynthesis" in window) speechSynthesis.cancel();
  ding();
  wordEl.classList.add("right");
  const c = $("check"); c.classList.remove("show"); void c.offsetWidth; c.classList.add("show");
  setTimeout(() => {
    c.classList.remove("show");
    order.splice(pos, 1); right++;
    busy = false;
    if(order.length === 0){ showDone(); return; }
    if(pos >= order.length) pos = 0;
    render();
  }, 650);
}

GROUPS.forEach(g => {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = g.name; b.dataset.id = g.id;
  b.style.setProperty("--c", g.color);
  b.onclick = () => setGroup(g);
  $("groups").appendChild(b);
});

$("next").onclick = () => step(1);
$("correct").onclick = markCorrect;
$("prev").onclick = () => step(-1);
card.onclick = () => step(1);
card.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); step(1); } };
document.addEventListener("keydown", e => {
  if(e.key === "ArrowRight") step(1);
  if(e.key === "ArrowLeft") step(-1);
});
$("shuffle").onclick = () => {
  if(finished || busy) return;
  for(let i = order.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [order[i],order[j]] = [order[j],order[i]]; }
  pos = 0; render();
};
$("split").onclick = () => { split = !split; $("split").setAttribute("aria-pressed", split); if(!finished) render(); };

// sound
const canSpeak = "speechSynthesis" in window;
let voice = null;
function pickVoice(){
  const vs = canSpeak ? speechSynthesis.getVoices() : [];
  voice = vs.find(v => /en[-_]US/i.test(v.lang) && /samantha|google|natural/i.test(v.name))
       || vs.find(v => /^en/i.test(v.lang)) || null;
}
if(canSpeak){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(){
  if(finished) return;
  if(mine.has(order[pos])){
    if(canSpeak) speechSynthesis.cancel();
    const b = $("speak"); b.classList.remove("on"); void b.offsetWidth; b.classList.add("on");
    playMine(order[pos]);
    return;
  }
  if(!canSpeak) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(order[pos]);
  u.lang = "en-US"; u.rate = split ? 0.5 : 0.75; u.pitch = 1.1;
  if(voice) u.voice = voice;
  speechSynthesis.speak(u);
  const b = $("speak"); b.classList.remove("on"); void b.offsetWidth; b.classList.add("on");
}
// speaker stays visible: it can also play your own recordings
$("speak").addEventListener("click", e => { e.stopPropagation(); say(); });
$("speak").addEventListener("keydown", e => e.stopPropagation());
$("speak").addEventListener("touchend", e => e.stopPropagation());
["click", "touchend", "keydown"].forEach(ev => $("forvo").addEventListener(ev, e => e.stopPropagation()));

// my voice recordings, saved only in this browser on this device
let dbp = null;
function vdb(){
  if(!dbp) dbp = new Promise((res, rej) => {
    const r = indexedDB.open("rf-voices", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("v");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function vget(k){
  try{
    const d = await vdb();
    return await new Promise(res => {
      const r = d.transaction("v").objectStore("v").get(k);
      r.onsuccess = () => res(r.result || null); r.onerror = () => res(null);
    });
  }catch(e){ return null; }
}
async function vset(k, val){
  const d = await vdb();
  return new Promise((res, rej) => {
    const t = d.transaction("v", "readwrite");
    t.objectStore("v").put(val, k);
    t.oncomplete = res; t.onerror = () => rej(t.error);
  });
}
const mine = new Set();
function markMine(){
  if(!finished && order.length) $("speak").classList.toggle("mine", mine.has(order[pos]));
}
(async () => {
  try{
    const d = await vdb();
    const r = d.transaction("v").objectStore("v").getAllKeys();
    r.onsuccess = () => { r.result.forEach(k => mine.add(k)); markMine(); };
  }catch(e){}
})();

let player = null;
async function playMine(w){
  const rec = await vget(w);
  if(!rec) return false;
  if(player){ player.pause(); URL.revokeObjectURL(player.src); }
  player = new Audio(URL.createObjectURL(rec.blob));
  try{ await player.play(); return true; }catch(e){ return false; }
}

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2600);
}

let recorder = null, recTimer = null;
async function toggleRecord(){
  if(recorder && recorder.state === "recording"){ recorder.stop(); return; }
  if(finished) return;
  if(!navigator.mediaDevices || !window.MediaRecorder){ toast("Recording isn’t supported in this browser."); return; }
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ toast("Couldn’t use the microphone. Check that it’s allowed for this page."); return; }
  const types = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"];
  const type = types.find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
  const word = order[pos], chunks = [];
  const r = type ? new MediaRecorder(stream, {mimeType:type}) : new MediaRecorder(stream);
  recorder = r;
  r.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
  r.onstop = async () => {
    clearTimeout(recTimer);
    stream.getTracks().forEach(t => t.stop());
    $("mic").classList.remove("rec"); $("mic").setAttribute("aria-label", "Record your voice");
    recorder = null;
    const blob = new Blob(chunks, {type: r.mimeType || type || "audio/webm"});
    if(blob.size < 500){ toast("That was too short. Try again."); return; }
    try{
      await vset(word, {blob});
      mine.add(word); markMine();
      toast(`Saved your voice for “${word}”`);
      playMine(word);
    }catch(e){ toast("Couldn’t save the recording on this device."); }
  };
  if(canSpeak) speechSynthesis.cancel();
  r.start();
  $("mic").classList.add("rec"); $("mic").setAttribute("aria-label", "Stop recording");
  toast("Recording… say the word, then tap to stop");
  recTimer = setTimeout(() => { if(r.state === "recording") r.stop(); }, 4000);
}
$("mic").addEventListener("click", e => { e.stopPropagation(); toggleRecord(); });
$("mic").addEventListener("touchend", e => e.stopPropagation());
$("mic").addEventListener("keydown", e => e.stopPropagation());

// swipe
let sx = null;
card.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, {passive:true});
card.addEventListener("touchend", e => {
  if(sx === null) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if(Math.abs(dx) > 50){ e.preventDefault(); step(dx < 0 ? 1 : -1); }
});

let saved = null;
try{ saved = localStorage.getItem("rf-group"); }catch(e){}
setGroup(GROUPS.find(g => g.id === saved) || GROUPS[0]);
</script>
